<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F" />
      <stop offset="50%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#0E1320" />
    </linearGradient>
    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="280" fill="#06B6D4" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="320" fill="#818CF8" opacity="0.09" filter="url(#glow)" />

  <!-- Grid Dots -->
  <g opacity="0.15">
    <circle cx="100" cy="100" r="2" fill="#FFFFFF" />
    <circle cx="200" cy="100" r="2" fill="#FFFFFF" />
    <circle cx="300" cy="100" r="2" fill="#FFFFFF" />
    <circle cx="400" cy="100" r="2" fill="#FFFFFF" />
    <circle cx="500" cy="100" r="2" fill="#FFFFFF" />
    <circle cx="600" cy="100" r="2" fill="#FFFFFF" />
    <circle cx="700" cy="100" r="2" fill="#FFFFFF" />
    <circle cx="800" cy="100" r="2" fill="#FFFFFF" />
    <circle cx="900" cy="100" r="2" fill="#FFFFFF" />
    <circle cx="1000" cy="100" r="2" fill="#FFFFFF" />
    <circle cx="1100" cy="100" r="2" fill="#FFFFFF" />
  </g>

  <!-- Left Side: Tech Architecture Node Graph -->
  <g transform="translate(80, 100)">
    <!-- Central Node: Next.js 14 -->
    <rect x="180" y="80" width="220" height="70" rx="16" fill="#131B2E" stroke="#06B6D4" stroke-width="2" />
    <text x="290" y="122" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Next.js 14 App Router</text>

    <!-- Connector Lines -->
    <path d="M 290 150 L 290 220" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4,4" opacity="0.7" />
    <path d="M 180 115 L 90 115 L 90 220" stroke="#818CF8" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
    <path d="M 400 115 L 490 115 L 490 220" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />

    <!-- Sub Nodes -->
    <!-- Supabase -->
    <rect x="0" y="220" width="180" height="60" rx="14" fill="#101726" stroke="#818CF8" stroke-width="1.5" />
    <text x="90" y="256" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Supabase RLS</text>

    <!-- Server Actions -->
    <rect x="200" y="220" width="180" height="60" rx="14" fill="#101726" stroke="#06B6D4" stroke-width="1.5" />
    <text x="290" y="256" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Server Actions</text>

    <!-- PostgreSQL / Cloud -->
    <rect x="400" y="220" width="180" height="60" rx="14" fill="#101726" stroke="#10B981" stroke-width="1.5" />
    <text x="490" y="256" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">PostgreSQL Cloud</text>

    <!-- Mobile Satellite: Flutter -->
    <rect x="180" y="320" width="220" height="60" rx="14" fill="#101726" stroke="#07DFFF" stroke-width="1.5" />
    <text x="290" y="356" fill="#07DFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Flutter Cross-Platform</text>
    <path d="M 290 280 L 290 320" stroke="#07DFFF" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
  </g>

  <!-- Right Side: Headline & Badge -->
  <g transform="translate(680, 150)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#0A2540" stroke="#06B6D4" stroke-width="1.5" />
    <circle cx="18" cy="18" r="5" fill="#67E8F9" />
    <text x="35" y="23" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Tech Stack &amp; Architecture</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="36" font-weight="800" line-height="1.2">
      <tspan x="0" dy="0">Panduan Memilih</tspan>
      <tspan x="0" dy="48" fill="url(#cyanTeal)">Tech Stack Website</tspan>
      <tspan x="0" dy="48">Bisnis &amp; UMKM</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="230" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="17" line-height="1.5">
      <tspan x="0" dy="0">Dari Next.js 14, Supabase, hingga Flutter.</tspan>
      <tspan x="0" dy="28">Perbandingan biaya, kecepatan, dan skalabilitas.</tspan>
    </text>

    <!-- Author Badge -->
    <g transform="translate(0, 310)">
      <circle cx="20" cy="20" r="20" fill="url(#violetCyan)" />
      <text x="20" y="25" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">JM</text>
      <text x="52" y="16" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Julhan Abdul Malik</text>
      <text x="52" y="32" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">Web &amp; Mobile App Developer</text>
    </g>
  </g>
</svg>

