<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F" />
      <stop offset="50%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#0E1320" />
    </linearGradient>
    <linearGradient id="flutterBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02569B" />
      <stop offset="50%" stop-color="#0175C2" />
      <stop offset="100%" stop-color="#13B9FD" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="30" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad3)" />

  <!-- Ambient Glow Circles -->
  <circle cx="280" cy="200" r="300" fill="#0175C2" opacity="0.12" filter="url(#glow3)" />
  <circle cx="950" cy="420" r="280" fill="#06B6D4" opacity="0.09" filter="url(#glow3)" />

  <!-- Blueprint Grid Pattern Overlay -->
  <g stroke="#ffffff" stroke-width="1" stroke-dasharray="4,8" opacity="0.08">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="440" x2="1200" y2="440" />
  </g>

  <!-- Left Side: Mobile Phone Clean Architecture Mockup -->
  <g transform="translate(100, 70)">
    <!-- Phone Frame -->
    <rect x="0" y="0" width="300" height="490" rx="36" fill="#0F1424" stroke="#1E293B" stroke-width="3" />
    
    <!-- Phone Notch / Island -->
    <rect x="100" y="14" width="100" height="18" rx="9" fill="#07090F" />
    
    <!-- Screen Content: Clean Architecture Layers -->
    <g transform="translate(24, 52)">
      <!-- Presentation Layer Card -->
      <rect x="0" y="0" width="252" height="110" rx="14" fill="#131B2E" stroke="#02569B" stroke-width="1.5" />
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#13B9FD" letter-spacing="1">1. PRESENTATION LAYER</text>
      <rect x="16" y="40" width="105" height="24" rx="6" fill="#02569B" opacity="0.4" />
      <text x="24" y="56" font-family="monospace" font-size="10" fill="#E2E8F0">BLoC / Provider</text>
      <rect x="129" y="40" width="105" height="24" rx="6" fill="#02569B" opacity="0.4" />
      <text x="141" y="56" font-family="monospace" font-size="10" fill="#E2E8F0">UI Screens</text>
      <rect x="16" y="72" width="220" height="24" rx="6" fill="#0175C2" opacity="0.2" />
      <text x="26" y="88" font-family="monospace" font-size="10" fill="#94A3B8">State / Event Streams</text>

      <!-- Down Arrow -->
      <path d="M 126 116 L 126 128 M 122 124 L 126 128 L 130 124" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" />

      <!-- Domain Layer Card -->
      <rect x="0" y="134" width="252" height="110" rx="14" fill="#131B2E" stroke="#06B6D4" stroke-width="1.5" />
      <text x="16" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#67E8F9" letter-spacing="1">2. DOMAIN LAYER</text>
      <rect x="16" y="174" width="105" height="24" rx="6" fill="#06B6D4" opacity="0.3" />
      <text x="28" y="190" font-family="monospace" font-size="10" fill="#E2E8F0">Use Cases</text>
      <rect x="129" y="174" width="105" height="24" rx="6" fill="#06B6D4" opacity="0.3" />
      <text x="145" y="190" font-family="monospace" font-size="10" fill="#E2E8F0">Entities</text>
      <rect x="16" y="206" width="220" height="24" rx="6" fill="#06B6D4" opacity="0.15" />
      <text x="26" y="222" font-family="monospace" font-size="10" fill="#94A3B8">Repository Interfaces</text>

      <!-- Down Arrow -->
      <path d="M 126 250 L 126 262 M 122 258 L 126 262 L 130 258" stroke="#13B9FD" stroke-width="2" stroke-linecap="round" />

      <!-- Data Layer Card -->
      <rect x="0" y="268" width="252" height="110" rx="14" fill="#131B2E" stroke="#02569B" stroke-width="1.5" />
      <text x="16" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#13B9FD" letter-spacing="1">3. DATA LAYER</text>
      <rect x="16" y="308" width="105" height="24" rx="6" fill="#02569B" opacity="0.4" />
      <text x="26" y="324" font-family="monospace" font-size="10" fill="#E2E8F0">API / Dio Client</text>
      <rect x="129" y="308" width="105" height="24" rx="6" fill="#02569B" opacity="0.4" />
      <text x="143" y="324" font-family="monospace" font-size="10" fill="#E2E8F0">Data Models</text>
      <rect x="16" y="340" width="220" height="24" rx="6" fill="#0175C2" opacity="0.2" />
      <text x="26" y="356" font-family="monospace" font-size="10" fill="#94A3B8">Local Cache &amp; Storage</text>
    </g>
  </g>

  <!-- Right Side: Headline & Technical Badges -->
  <g transform="translate(460, 140)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="170" height="34" rx="17" fill="#0175C2" opacity="0.2" stroke="#0175C2" stroke-width="1.5" />
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#67E8F9" letter-spacing="1">FLUTTER &amp; DART</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      Clean Architecture
    </text>
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="url(#cyanAccent)" letter-spacing="-0.5">
      pada Flutter Mobile App
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#94A3B8" width="600">
      Struktur folder modular, pemisahan BLoC / Provider,
    </text>
    <text x="0" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#94A3B8">
      dan integrasi REST API yang siap di-test &amp; publish.
    </text>

    <!-- Tech Badges Row -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="105" height="36" rx="8" fill="#131B2E" stroke="#1E293B" />
      <text x="18" y="23" font-family="monospace" font-size="12" fill="#E2E8F0">Flutter 3.x</text>

      <rect x="117" y="0" width="85" height="36" rx="8" fill="#131B2E" stroke="#1E293B" />
      <text x="135" y="23" font-family="monospace" font-size="12" fill="#E2E8F0">Dart</text>

      <rect x="214" y="0" width="125" height="36" rx="8" fill="#131B2E" stroke="#1E293B" />
      <text x="228" y="23" font-family="monospace" font-size="12" fill="#E2E8F0">BLoC Pattern</text>

      <rect x="351" y="0" width="135" height="36" rx="8" fill="#131B2E" stroke="#1E293B" />
      <text x="365" y="23" font-family="monospace" font-size="12" fill="#E2E8F0">Dio REST API</text>

      <rect x="498" y="0" width="140" height="36" rx="8" fill="#131B2E" stroke="#1E293B" />
      <text x="512" y="23" font-family="monospace" font-size="12" fill="#E2E8F0">Clean Architecture</text>
    </g>

    <!-- Author Badge -->
    <g transform="translate(0, 340)">
      <circle cx="20" cy="20" r="18" fill="#131B2E" stroke="#0175C2" stroke-width="2" />
      <text x="14" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#67E8F9">J</text>
      <text x="50" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Julhan Abdul Malik</text>
      <text x="50" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Web &amp; Mobile App Developer</text>
    </g>
  </g>
</svg>

