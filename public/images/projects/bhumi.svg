<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bhumiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="60%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#07090F"/>
    </linearGradient>
    <linearGradient id="glowEarth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bhumiBg)" stroke="#10B981" stroke-opacity="0.3" stroke-width="2"/>
  
  <rect width="800" height="42" rx="16" fill="#0A0E1A" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="46" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="64" cy="21" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="26" fill="#64748B" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">bhumi.web.id • Landing Page Game Edukasi Lingkungan (Android &amp; Windows)</text>

  <!-- Hero Content -->
  <g transform="translate(40, 75)">
    <!-- Pill tag -->
    <rect width="180" height="26" rx="13" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="90" y="17" fill="#34D399" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🎮 Game Edukasi Lingkungan</text>

    <text x="0" y="70" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="32" font-weight="800">Petualangan Bhumi:</text>
    <text x="0" y="105" fill="#6EE7B7" font-family="Inter, sans-serif" font-size="28" font-weight="700">Selamatkan Ekosistem Bumi!</text>
    <text x="0" y="135" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Kolaborasi riset lintas institusi Universitas Nusa Putra &amp; Universitas Negeri Padang</text>

    <!-- Metrics -->
    <g transform="translate(0, 160)">
      <rect width="130" height="60" rx="8" fill="#0A0E1A" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="14" y="24" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Active Players</text>
      <text x="14" y="48" fill="#34D399" font-family="Inter, sans-serif" font-size="18" font-weight="700">1.000+</text>
    </g>
    <g transform="translate(145, 160)">
      <rect width="130" height="60" rx="8" fill="#0A0E1A" stroke="#F59E0B" stroke-opacity="0.3"/>
      <text x="14" y="24" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">User Rating</text>
      <text x="14" y="48" fill="#FBBF24" font-family="Inter, sans-serif" font-size="18" font-weight="700">★ 4.8 / 5.0</text>
    </g>
    <g transform="translate(290, 160)">
      <rect width="130" height="60" rx="8" fill="#0A0E1A" stroke="#3B82F6" stroke-opacity="0.3"/>
      <text x="14" y="24" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Platform</text>
      <text x="14" y="48" fill="#60A5FA" font-family="Inter, sans-serif" font-size="14" font-weight="700">Android &amp; PC</text>
    </g>

    <!-- Badges download -->
    <g transform="translate(0, 245)">
      <rect width="150" height="38" rx="8" fill="#10B981"/>
      <text x="75" y="23" fill="#07090F" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">▶ Download Game</text>
    </g>
    <g transform="translate(165, 245)">
      <rect width="130" height="38" rx="8" fill="#131829" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="65" y="23" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Lihat Trailer</text>
    </g>

    <!-- Bottom summary -->
    <g transform="translate(0, 310)">
      <rect width="420" height="65" rx="8" fill="#0A0E1A" stroke="#FFFFFF" stroke-opacity="0.05"/>
      <text x="14" y="24" fill="#34D399" font-family="Inter, sans-serif" font-size="11" font-weight="600">Teknologi Landing Page:</text>
      <text x="14" y="46" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">⚡ High-performance Responsive Web with Immersive Sound &amp; Visuals</text>
    </g>
  </g>

  <!-- Right: Artwork Graphic Earth Illustration -->
  <g transform="translate(500, 100)">
    <circle cx="130" cy="150" r="110" fill="#0E2822" stroke="url(#glowEarth)" stroke-width="4"/>
    <circle cx="130" cy="150" r="95" fill="#064E3B" fill-opacity="0.5"/>
    <path d="M 80 120 Q 110 90 140 110 T 190 140 T 170 190 T 100 170 Z" fill="#10B981" fill-opacity="0.7"/>
    <path d="M 100 200 Q 140 220 180 200 T 150 230 Z" fill="#3B82F6" fill-opacity="0.6"/>
    <!-- Orbit ring -->
    <ellipse cx="130" cy="150" rx="140" ry="45" fill="none" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.6" transform="rotate(-25 130 150)"/>
  </g>
</svg>

