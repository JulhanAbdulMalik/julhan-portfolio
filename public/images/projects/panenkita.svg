<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="panenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#07090F"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#panenBg)"/>
  
  <!-- Header -->
  <rect width="800" height="42" rx="16" fill="#0A0E1A" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="46" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="64" cy="21" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="26" fill="#64748B" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">panenkita.web.id • Platform Agritech &amp; SCM (Flutter + React + Express)</text>

  <!-- Left: Web Marketplace Dashboard Mockup -->
  <g transform="translate(30, 65)">
    <rect width="470" height="400" rx="10" fill="#0A0E1A" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <!-- Top banner -->
    <rect width="470" height="110" rx="10" fill="#064E3B" fill-opacity="0.4"/>
    <text x="24" y="45" fill="#34D399" font-family="Inter, sans-serif" font-size="18" font-weight="700">🌾 PanenKita Agritech</text>
    <text x="24" y="70" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Rencana Tanam, Stok Real-Time Petani, &amp; Marketplace SCM</text>
    <g transform="translate(24, 82)">
      <rect width="110" height="20" rx="10" fill="#10B981"/>
      <text x="55" y="14" fill="#0A0E1A" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Google Play Store</text>
    </g>

    <!-- Grid cards -->
    <g transform="translate(20, 130)">
      <rect width="135" height="120" rx="8" fill="#131829" stroke="#10B981" stroke-opacity="0.2"/>
      <circle cx="67" cy="40" r="18" fill="#10B981" fill-opacity="0.2"/>
      <text x="67" y="45" fill="#34D399" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🌱</text>
      <text x="67" y="80" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Rencana Tanam</text>
      <text x="67" y="98" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Prediksi Panen</text>
    </g>
    <g transform="translate(165, 130)">
      <rect width="135" height="120" rx="8" fill="#131829" stroke="#06B6D4" stroke-opacity="0.2"/>
      <circle cx="67" cy="40" r="18" fill="#06B6D4" fill-opacity="0.2"/>
      <text x="67" y="45" fill="#67E8F9" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">📦</text>
      <text x="67" y="80" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Kebutuhan Hasil</text>
      <text x="67" y="98" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Permintaan Pasar</text>
    </g>
    <g transform="translate(310, 130)">
      <rect width="140" height="120" rx="8" fill="#131829" stroke="#F59E0B" stroke-opacity="0.2"/>
      <circle cx="70" cy="40" r="18" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="70" y="45" fill="#FBBF24" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🤝</text>
      <text x="70" y="80" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Marketplace</text>
      <text x="70" y="98" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Direct to Buyer</text>
    </g>

    <!-- Bottom verification tag -->
    <g transform="translate(20, 270)">
      <rect width="430" height="110" rx="8" fill="#131C2E" stroke="#FFFFFF" stroke-opacity="0.05"/>
      <text x="16" y="26" fill="#67E8F9" font-family="Inter, sans-serif" font-size="11" font-weight="600">Hasil Riset Skripsi &amp; Pengujian Nyata:</text>
      <text x="16" y="50" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">✓ UAT Berhasil dengan 31 Pengguna Riil</text>
      <text x="16" y="70" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">✓ Unit Testing (Jest) &amp; Black Box Testing</text>
      <text x="16" y="90" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">✓ Backend Terpadu Express.js + PostgreSQL + Firebase Auth</text>
    </g>
  </g>

  <!-- Right: Flutter Mobile Device Mockup -->
  <g transform="translate(525, 75)">
    <!-- Phone body -->
    <rect width="245" height="380" rx="28" fill="#0A0E1A" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="3"/>
    <!-- Notch -->
    <rect x="75" y="10" width="95" height="16" rx="8" fill="#07090F"/>
    <!-- Phone Screen content -->
    <rect x="12" y="32" width="221" height="336" rx="18" fill="#0E1726"/>
    <text x="24" y="58" fill="#34D399" font-family="Inter, sans-serif" font-size="12" font-weight="700">PanenKita Mobile</text>
    <rect x="24" y="70" width="197" height="65" rx="8" fill="#10B981" fill-opacity="0.15"/>
    <text x="36" y="94" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="10" font-weight="600">Harga Komoditas Hari Ini</text>
    <text x="36" y="114" fill="#34D399" font-family="Inter, sans-serif" font-size="14" font-weight="700">Rp 18.500 / kg</text>
    
    <!-- Mobile item list -->
    <rect x="24" y="148" width="197" height="42" rx="6" fill="#131829"/>
    <text x="36" y="172" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="10">Cabai Merah Keriting</text>
    <rect x="24" y="198" width="197" height="42" rx="6" fill="#131829"/>
    <text x="36" y="222" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="10">Bawang Merah Brebes</text>
    <rect x="24" y="248" width="197" height="42" rx="6" fill="#131829"/>
    <text x="36" y="272" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="10">Jagung Manis Organik</text>

    <!-- Flutter Tag -->
    <rect x="55" y="315" width="135" height="24" rx="12" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-opacity="0.5"/>
    <text x="122" y="331" fill="#67E8F9" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Built with Flutter / Dart</text>
  </g>
</svg>

