      <text x="12" y="22" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Booking QRIS/Bank</text>
      <text x="12" y="48" fill="#67E8F9" font-family="Inter, sans-serif" font-size="16" font-weight="700">142 Pesanan</text>
    </g>

    <!-- Analytics Chart -->
    <g transform="translate(20, 140)">
      <rect width="320" height="150" rx="8" fill="#131829" stroke="#FFFFFF" stroke-opacity="0.04"/>
      <text x="14" y="24" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Grafik Omset Harian (Recharts)</text>
      <path d="M 20 120 Q 70 80 120 100 T 200 50 T 270 70 T 300 30" fill="none" stroke="url(#purplePink)" stroke-width="3"/>
      <circle cx="120" cy="100" r="4" fill="#A855F7"/>
      <circle cx="200" cy="50" r="4" fill="#EC4899"/>
      <circle cx="300" cy="30" r="4" fill="#EC4899"/>
    </g>

    <!-- Backend stack -->
    <g transform="translate(20, 305)">
      <rect width="320" height="75" rx="8" fill="#0E1320" stroke="#A855F7" stroke-opacity="0.2"/>
      <text x="14" y="24" fill="#C084FC" font-family="Inter, sans-serif" font-size="11" font-weight="600">Database &amp; Keamanan:</text>
      <text x="14" y="46" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">⚡ Supabase Row Level Security (RLS)</text>
