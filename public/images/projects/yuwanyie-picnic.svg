    </g>

    <!-- Catalog cards -->
    <g transform="translate(20, 150)">
      <rect width="150" height="110" rx="8" fill="#131829" stroke="#A855F7" stroke-opacity="0.2"/>
      <rect x="12" y="12" width="126" height="50" rx="4" fill="#3B0764"/>
      <text x="75" y="42" fill="#E9D5FF" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Sunset Package</text>
      <text x="12" y="80" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="600">Romantic Sunset</text>
      <text x="12" y="98" fill="#C084FC" font-family="Inter, sans-serif" font-size="11" font-weight="700">Rp 350.000</text>
    </g>
