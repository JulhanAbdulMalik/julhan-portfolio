  <rect width="800" height="500" rx="16" fill="url(#yuBg)"/>
  
  <rect width="800" height="42" rx="16" fill="#0A0E1A" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="46" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="64" cy="21" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="26" fill="#64748B" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">yuwanyie-picnic.com • Web App &amp; Business Management System (Next.js 16 + React 19 + Supabase)</text>

  <!-- Left: Customer Storefront Preview -->
  <g transform="translate(30, 65)">
    <rect width="360" height="400" rx="10" fill="#0A0E1A" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <!-- Hero promo -->
    <rect width="360" height="130" rx="10" fill="#2E1065" fill-opacity="0.4"/>
    <text x="20" y="45" fill="#C084FC" font-family="Inter, sans-serif" font-size="16" font-weight="700">🧺 Yuwanyie Picnic Experience</text>
    <text x="20" y="70" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Customer Storefront, Galeri, &amp; Booking QRIS</text>
    <g transform="translate(20, 85)">
