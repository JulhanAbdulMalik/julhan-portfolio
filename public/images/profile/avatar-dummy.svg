<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0A2535" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#07090F" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGlow)"/>
  <rect x="2" y="2" width="396" height="396" rx="30" fill="none" stroke="url(#borderGlow)" stroke-width="2"/>

  <!-- Subtle grid lines -->
  <line x1="50" y1="0" x2="50" y2="400" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="400" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="250" y1="0" x2="250" y2="400" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="350" y1="0" x2="350" y2="400" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="100" x2="400" y2="100" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="300" x2="400" y2="300" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Silhouette Avatar -->
  <circle cx="200" cy="155" r="65" fill="#131C2E" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M90 350 C90 255, 140 230, 200 230 C260 230, 310 255, 310 350 Z" fill="url(#bodyGrad)" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Code/Tech badges floating -->
  <g transform="translate(60, 80)">
    <rect width="70" height="26" rx="13" fill="#0E1320" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5"/>
    <text x="35" y="17" fill="#67E8F9" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">&lt;code/&gt;</text>
  </g>
  <g transform="translate(270, 100)">
    <rect width="70" height="26" rx="13" fill="#0E1320" stroke="#67E8F9" stroke-width="1" stroke-opacity="0.5"/>
    <text x="35" y="17" fill="#67E8F9" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">React 19</text>
  </g>
  <g transform="translate(45, 270)">
    <rect width="80" height="26" rx="13" fill="#0E1320" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5"/>
    <text x="40" y="17" fill="#67E8F9" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Flutter Dev</text>
  </g>
  <g transform="translate(275, 270)">
    <rect width="80" height="26" rx="13" fill="#0E1320" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5"/>
    <text x="40" y="17" fill="#67E8F9" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Full Stack</text>
  </g>

  <!-- Status tag at bottom -->
  <g transform="translate(105, 335)">
    <rect width="190" height="32" rx="16" fill="#0E1320" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="24" cy="16" r="4" fill="#10B981"/>
    <text x="36" y="20" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="500">Julhan Abdul Malik</text>
  </g>
</svg>

